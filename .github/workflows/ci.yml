name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint is non-blocking for now: the codebase has ~127 pre-existing
      # eslint errors (mostly `any` in the Supabase edge functions). Make this
      # step required once they're cleaned up.
      - run: npm run lint
        continue-on-error: true

      - run: npm test

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
