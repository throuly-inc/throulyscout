[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: serve index.html for all routes so React Router handles them.
# Existing files (assets, sitemap.xml, robots.txt) are still served directly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
